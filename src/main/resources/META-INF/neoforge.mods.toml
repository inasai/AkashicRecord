modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors = "Inasai"
logoFile="logo.png"
description='''
"Akashic Chronicles" book: place an item inside to study it, then obtain that item in exchange for Knowledge points.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="projecte"
type="optional"
versionRange="${projecte_version}"
ordering="AFTER"
side="BOTH"
