plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    // ProjectE підключається лише через рефлексію (необов'язкова залежність).
    // JEI та EMI потрібні лише для компіляції плагінів (compileOnly); у грі мод працює і без них.
    // Якщо Gradle не знаходить версію, змініть її на актуальну для Minecraft 1.21.1.
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247"
    compileOnly "dev.emi:emi-neoforge:1.1.22+1.21.1"
}

// Підставляє значення з gradle.properties у ${...} у neoforge.mods.toml
processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            projecte_version       : projecte_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
